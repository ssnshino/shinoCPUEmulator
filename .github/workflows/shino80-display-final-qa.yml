name: SHINO-80 Display Final QA

on:
  push:
    branches:
      - feature/shino80-cgrom-native8x16-dm80-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Source and full repository tests
        run: npm test

      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright

      - name: Locate system Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME="$(command -v chromium)"
          fi
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Chrome: $CHROME"

      - name: Real browser smoke
        run: python tests/browser_smoke_v0.0.9.py

      - name: Capture actual DM-80 renders
        shell: bash
        run: |
          mkdir -p qa
          python - <<'PY'
          from pathlib import Path
          import json, os
          from playwright.sync_api import sync_playwright

          root=Path.cwd()
          html=(root/'deploy'/'one_page_shino80_v0.0.9_z80_base_complete.html').read_text()
          chrome=os.environ['CHROMIUM_PATH']

          def boot(page):
              errors=[]
              page.on('pageerror', lambda e: errors.append(str(e)))
              page.set_content(html, wait_until='load')
              page.wait_for_timeout(180)
              page.locator('#powerBtn').click()
              page.wait_for_timeout(100)
              page.locator('#moreBtn').click()
              page.locator('[data-more-action="pace"]').click()
              page.locator('[data-more-action="pace"]').click()
              page.locator('#moreCloseBtn').click()
              page.wait_for_timeout(100)
              page.locator('#runPauseBtn').click()
              page.wait_for_function("document.querySelector('#statusPc')?.textContent === '009C'", timeout=3000)
              page.locator('#runPauseBtn').click()
              page.wait_for_timeout(120)
              if errors:
                  raise RuntimeError(errors)
              return {
                  'renderMode':page.locator('#crtViewport').get_attribute('data-render-mode'),
                  'pc':page.locator('#statusPc').inner_text(),
                  'selfTest':page.locator('#selfTest').inner_text(),
              }

          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'])

              mobile=browser.new_page(viewport={'width':390,'height':844})
              report['mobile']=boot(mobile)
              mobile.screenshot(path='qa/dm80-mobile-390x844.png', full_page=True)
              mobile.locator('#displayDevice').screenshot(path='qa/dm80-mobile-monitor.png')

              desktop=browser.new_page(viewport={'width':1440,'height':900})
              report['desktop']=boot(desktop)
              desktop.screenshot(path='qa/dm80-desktop-1440x900.png', full_page=True)
              desktop.locator('#displayDevice').screenshot(path='qa/dm80-desktop-monitor.png')

              browser.close()

          (root/'qa'/'display-render-report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Diff check
        run: git diff --check

      - name: Generated artifact reproducibility and clean tree
        shell: bash
        run: |
          npm run build
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after rebuild:"
            git status --short
            git diff -- deploy/one_page_shino80_v0.0.9_z80_base_complete.html || true
            exit 1
          fi
          echo "Working tree clean"

      - uses: actions/upload-artifact@v4
        with:
          name: shino80-display-qa
          path: qa/
          if-no-files-found: error
